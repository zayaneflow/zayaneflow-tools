<style>
/* A gold project coin, sliced into the meetings it takes to win it. Each slice is what one meeting is worth;
   your fee is a sliver of each slice; put together, the slivers are what the client pays per project.
   Price hero top-left, inspector + call line top-right, step transport above a fader console.
   Same teal-to-amber grade as the planner. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#05070a; --panel:#11161a; --panel-2:#171e24; --inset:#06080a;
  --glass:rgba(11,15,19,.74); --line:#222a31; --line-2:#34404a;
  --fg:#eaedef; --muted:#8e99a1; --faint:#5f6b75;
  --cold:#41b6cc; --mid:#44a6c6; --warm:#f0a03c; --hot:#ffd57f; --on-warm:#1c1206; --warm-soft:rgba(240,160,60,.12);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:radial-gradient(1100px 560px at 70% -10%, rgba(240,160,60,.07), transparent 60%),var(--bg);
  color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 56px;min-height:100%;
}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:1600px;margin:0 auto;display:grid;gap:12px}
.shell>*,.top>*,.studio>*{min-width:0}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;min-width:0}
.logo{width:32px;height:32px;flex:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.sel{appearance:none;-webkit-appearance:none;background:var(--inset) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238e99a1' stroke-width='1.5'/></svg>") no-repeat right 12px center;
  border:1px solid var(--line);border-radius:999px;color:var(--fg);font-size:13px;font-weight:500;padding:7px 30px 7px 12px;max-width:190px;cursor:pointer}
.sel option,.sel optgroup{background:#13181c;color:var(--fg)}
@media (max-width:620px){ .mark span{font-size:11px;letter-spacing:.12em} .ctrls{margin-left:auto} .sel{max-width:150px;font-size:12.5px} }

/* studio */
.studio{position:relative;display:grid;gap:12px}
.viewport{position:relative;height:clamp(500px,138vw,660px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#05070a;
  box-shadow:0 30px 80px -40px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.02);touch-action:pan-y}
@media (min-width:640px){ .viewport{height:clamp(560px,76vh,780px)} }
.viewport canvas.gl{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:grab;outline:none}
.viewport canvas.gl.hov{cursor:pointer}
.viewport canvas.gl:active{cursor:grabbing}
.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.5) 100%),
    linear-gradient(var(--line-2),var(--line-2)) 12px 12px/20px 1.5px no-repeat,
    linear-gradient(var(--line-2),var(--line-2)) 12px 12px/1.5px 20px no-repeat,
    linear-gradient(var(--line-2),var(--line-2)) calc(100% - 12px) 12px/20px 1.5px no-repeat,
    linear-gradient(var(--line-2),var(--line-2)) calc(100% - 13.5px) 12px/1.5px 20px no-repeat}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:none;color:var(--fg);text-align:center;display:grid;justify-items:center;gap:3px;padding:0 8px;will-change:transform;transition:opacity .3s}
.lbl span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#aeb7bd;text-shadow:0 1px 8px #000;white-space:nowrap}
.lbl b{font-family:var(--display);font-weight:800;font-size:30px;line-height:.9;letter-spacing:.01em;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.95);white-space:nowrap}
.lbl em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--hot);white-space:nowrap}
.lbl.above::after{content:"";width:1px;height:18px;background:linear-gradient(var(--c,var(--hot)),transparent);margin-top:3px}
.lbl.side{justify-items:start;text-align:left;padding-left:16px}
.lbl.side::before{content:"";position:absolute;left:0;top:50%;width:12px;height:1px;background:linear-gradient(90deg,transparent,var(--hot))}
.lbl.box{background:rgba(6,9,12,.78);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl.hot b{color:var(--hot)} .lbl.cold b{color:var(--cold)}
.lbl.dim{opacity:.35}
.lbl[hidden]{display:none}
.hud{position:absolute;left:22px;top:18px;right:22px;pointer-events:none;display:grid;gap:8px;justify-items:start}
.eyebrow{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.price b{font-family:var(--display);font-weight:900;font-size:clamp(64px,8.4vw,124px);line-height:.82;font-variant-numeric:tabular-nums;white-space:nowrap;
  background-image:linear-gradient(180deg,#fff6dc 0%,var(--hot) 48%,#e39a33 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 40px rgba(255,213,127,.3));padding-bottom:6px}
.price span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chainline{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chainline em{font-style:normal;color:var(--fg);background:rgba(17,22,26,.85);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;white-space:nowrap}
.chainline em.w{color:var(--hot);border-color:rgba(240,160,60,.5)}

.caption{position:absolute;left:50%;bottom:calc(var(--tph,58px) + 24px);transform:translate(-50%,6px);width:max-content;max-width:min(640px,calc(100% - 28px));
  text-align:center;font-size:15px;font-weight:500;line-height:1.4;color:var(--fg);background:rgba(7,10,13,.8);border:1px solid var(--line-2);border-radius:12px;
  padding:9px 15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-wrap:balance}
.caption.on{opacity:1;transform:translate(-50%,0)}
.caption b{color:var(--hot);font-weight:600}
.transport3{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:7px;background:rgba(7,10,13,.8);
  border:1px solid var(--line-2);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tp-play{position:relative;flex:none;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--on-warm);
  background:linear-gradient(180deg,var(--hot),var(--warm));border:0;border-radius:999px;padding:10px 18px 10px 15px;cursor:pointer;box-shadow:0 8px 30px -8px rgba(240,160,60,.65);white-space:nowrap}
.tp-play svg{width:12px;height:12px;fill:currentColor;flex:none}
.tp-play.playing{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.tp-play.pulse::before{content:"";position:absolute;inset:-5px;border-radius:999px;border:2px solid rgba(255,213,127,.55);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.steps{display:flex;gap:3px;flex:1;min-width:0;padding:3px;background:var(--inset);border:1px solid var(--line);border-radius:999px}
.steps button{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 8px;cursor:pointer;white-space:nowrap;overflow:hidden}
.steps button i{font-style:normal;font-family:var(--mono);font-size:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--faint);flex:none}
.steps button span{overflow:hidden;text-overflow:ellipsis}
.steps button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.steps button[aria-pressed="true"] i,.steps button.done i{border-color:var(--warm);color:var(--hot)}
.steps button:hover{color:var(--fg)}
.tp-fs{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--inset);color:var(--fg);display:none;place-items:center;cursor:pointer}
.tp-fs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.tp-fs:hover{border-color:var(--muted)}
@media (min-width:1080px){ .fs-ok .tp-fs{display:grid} }
@media (min-width:1080px) and (max-width:1299px){ .steps button:not([aria-pressed="true"]) span{display:none} .steps button[aria-pressed="true"]{flex:2.6 1 0} }
.studio:fullscreen{height:100vh!important;max-height:none;background:var(--bg)}
.studio:fullscreen .viewport{border-radius:0;border:0}
.vnotes{position:absolute;right:18px;bottom:calc(var(--tph,58px) + 26px);display:grid;gap:3px;text-align:right;font-family:var(--mono);font-size:9.5px;color:var(--faint);pointer-events:none;max-width:46%}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:14px;background:radial-gradient(circle at 50% 50%, rgba(240,160,60,.1), transparent 60%)}
.nogl p{max-width:42ch;margin:0}
@media (max-width:620px){
  .caption{font-size:13.5px;padding:8px 12px}
  .tp-play span{display:none}
  .tp-play{padding:11px 13px}
  .steps button span{display:none}
  .steps button{padding:7px 4px}
  .lbl b{font-size:22px} .lbl span{font-size:8.5px}
  .vnotes{display:none}
  .hud{left:16px;top:14px;right:16px}
  .chainline{font-size:10.5px;gap:5px}
}

/* panels */
.panel{background:linear-gradient(180deg,rgba(23,30,36,.92),rgba(14,19,23,.94));border:1px solid var(--line);border-radius:14px;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 60px -28px rgba(0,0,0,.8)}
.console{padding:14px 16px 16px;display:grid;gap:16px}
.ctl{display:grid;gap:4px;min-width:0}
.ctl-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ctl label{font-weight:600;font-size:13.5px;line-height:1.25;min-width:0}
.ctl .hint2{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
.val{display:flex;align-items:baseline;gap:2px;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;flex:none}
.val .u{color:var(--faint);font-size:19px}
.val input{width:8.6ch;font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--line-2);text-align:right;padding:0 0 2px;font-variant-numeric:tabular-nums}
.val input.short{width:3.2ch}
.val input:focus{outline:none;border-bottom-color:var(--hot)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer}
input[type=range]:focus-visible{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--warm)) 0 0/var(--p,50%) 100% no-repeat,var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--warm))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:26px;margin-top:-11px;border:0;border-radius:4px;
  background:linear-gradient(180deg,#f3f5f7 0 45%,#272d34 45% 55%,#c6cdd3 55% 100%);box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:16px;height:26px;border:0;border-radius:4px;background:linear-gradient(180deg,#f3f5f7 0 45%,#272d34 45% 55%,#c6cdd3 55% 100%)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--hot)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px}
.toggle label{font-size:13.5px;font-weight:600;flex:1;min-width:0;line-height:1.3}
.toggle label span.h{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
@media (min-width:1080px){ .toggle label span.h{display:none} }
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line-2);border-radius:28px;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch input:checked + i{background:var(--warm)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--hot);outline-offset:2px}

.inspector{padding:16px;display:grid;gap:11px;align-content:start}
.ins-k{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--hot))}
.ins-k i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--hot));box-shadow:0 0 10px var(--c,var(--hot))}
.inspector h3{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em;text-wrap:balance}
.inspector p{margin:0;color:#c9d1d6;font-size:14px;line-height:1.55}
.inspector p b{color:var(--hot);font-weight:600}
.mathline{font-family:var(--mono);font-size:11.5px;color:var(--fg);background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:9px 11px;line-height:1.6;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:5px}
.dots span{width:18px;height:3px;border-radius:2px;background:var(--line-2)}
.dots span.on{background:var(--c,var(--hot))}
.nav{display:flex;gap:6px}
.nav button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--inset);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.nav button:hover{border-color:var(--muted)}
.nav svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.say{display:grid;gap:9px;margin-top:4px;padding:13px 14px;border-radius:12px;border:1px solid rgba(240,160,60,.35);background:linear-gradient(180deg,rgba(240,160,60,.09),rgba(240,160,60,.02))}
.say h4{margin:0;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.say p{margin:0;font-size:15px;font-weight:500;line-height:1.45;color:var(--fg)}
.copy{justify-self:start;font-size:12.5px;font-weight:600;color:var(--on-warm);background:var(--warm);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.copy:hover{background:var(--hot)}

@media (min-width:1080px){
  .studio{display:block;height:clamp(660px,calc(100vh - var(--hdr,52px) - 36px),980px)}
  .viewport{position:absolute;inset:0;height:auto}
  .console{position:absolute;left:16px;right:16px;bottom:16px;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(220px,.9fr);align-items:end;gap:30px;padding:13px 20px 14px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .console .hint2{display:none}
  .toggle{padding-bottom:2px}
  .inspector{position:absolute;right:16px;top:16px;width:350px;max-height:calc(100% - var(--ch,96px) - 40px);overflow:auto;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .transport3{left:28px;right:394px;bottom:calc(var(--ch,96px) + 30px)}
  .caption{left:calc((100% - 366px)/2);bottom:calc(var(--ch,96px) + var(--tph,58px) + 46px)}
  .vnotes{right:28px;bottom:calc(var(--ch,96px) + 34px);max-width:340px}
  .hud{right:400px;left:24px;top:22px}
}
@media (max-width:1079px){ .inspector{order:1} .console{order:2} }

/* the numbers, below the fold */
.full{display:grid;gap:16px;padding-top:26px;border-top:1px dashed var(--line-2);margin-top:6px}
.full h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1;letter-spacing:.01em}
.numbers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){ .numbers{grid-template-columns:minmax(0,1fr)} }
.numbers .panel{padding:18px;display:grid;gap:16px}
.sec-label{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0;padding-bottom:0}
.mrow .ml{font-size:14px;color:var(--muted)}
.mrow .res{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.mrow .eq{grid-column:1 / -1;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.mrow.hl .res{color:var(--hot)} .mrow.c .res{color:var(--cold)}
.proj-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.proj-top b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.bar{display:flex;height:34px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar .cost{background:repeating-linear-gradient(90deg,var(--warm) 0 calc(var(--seg) - 2px),#b8661a calc(var(--seg) - 2px) var(--seg));transition:flex-basis .4s ease;min-width:4px}
.bar .keep{flex:1;background:linear-gradient(90deg,rgba(65,182,204,.55),rgba(65,182,204,.25))}
.legend2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.legend2 .a{color:var(--hot)} .legend2 .b{color:var(--cold);text-align:right}
.legend2 small{display:block;font-family:var(--mono);font-size:11px;color:var(--faint)}
.roi{display:flex;align-items:baseline;gap:10px}
.roi b{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--cold)}
.roi span{font-size:13px;color:var(--muted)}
.foot{margin:0;font-size:12.5px;color:var(--faint);max-width:76ch}
@media (prefers-reduced-motion:reduce){.switch i,.switch i::after,.lbl,.caption,.bar .cost{transition:none} .tp-play.pulse::before{animation:none}}

<body>

<div class="shell">
  <header class="top">
    <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="logo" aria-hidden="true"><defs><radialGradient id="prc" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3d1"/><stop offset=".5" stop-color="#ffd57f"/><stop offset="1" stop-color="#e08f2c"/></radialGradient><linearGradient id="prb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2228"/><stop offset="1" stop-color="#0d1115"/></linearGradient></defs><rect x="1" y="1" width="46" height="46" rx="12" fill="url(#prb)" stroke="#2f3a43"/><circle cx="24" cy="24" r="17" fill="none" stroke="#41b6cc" stroke-width="1.6" stroke-dasharray="2.2 3.1" opacity=".75"/><circle cx="24" cy="24" r="12.5" fill="url(#prc)"/><circle cx="24" cy="24" r="10.2" fill="none" stroke="#1c1206" stroke-opacity=".22" stroke-width="1"/><path d="M26.2 15.5 18.6 25.6h4.9l-1.7 7 7.6-10.1h-4.9z" fill="#1c1206"/></svg><span data-i18n="brand">2-Second Meeting Pricer</span></div>

      <label class="vh" for="cur" data-i18n="cur">Currency</label><select id="cur" class="sel"></select>
    </div>
  </header>

  <section class="studio" id="studio">

      <div class="labels" id="labels"></div>

      <div class="vnotes" id="vnotes"><span id="hint"></span><span id="unitNote"></span></div>
      <div class="caption" id="caption" aria-live="polite"></div>

        <button class="tp-play pulse" id="cta" type="button"><svg viewBox="0 0 12 14" aria-hidden="true" id="cta-ico"><path d="M0 0 L12 7 L0 14 Z"/></svg><span id="cta-t" data-i18n="play_cta">Play the pitch</span></button>
        <div class="steps" id="steps" role="group"></div>
        <button class="tp-fs" id="fs" type="button"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
      </div>
      <div class="nogl" id="nogl" hidden><p data-i18n="nogl"></p></div>
    </div>

    <aside class="panel console" id="console">
      <div class="ctl">
        <div class="ctl-top">
          <label for="cutR"><span data-i18n="cut_l"></span><span class="hint2" data-i18n="cut_h"></span></label>
          <div class="val"><input id="cut" class="short" type="text" inputmode="decimal" value="10"><span class="u">%</span></div>
        </div>
        <input id="cutR" type="range" min="1" max="50" step="1" value="10">
      </div>
      <div class="ctl">
        <div class="ctl-top">
          <label for="closeR"><span data-i18n="close_l"></span><span class="hint2" data-i18n="close_h"></span></label>
          <div class="val"><input id="close" class="short" type="text" inputmode="decimal" value="20"><span class="u">%</span></div>
        </div>
        <input id="closeR" type="range" min="1" max="80" step="1" value="20">
      </div>
      <div class="ctl">
        <div class="ctl-top">
          <label for="dealR"><span data-i18n="deal_l"></span><span class="hint2" data-i18n="deal_h"></span></label>
          <div class="val"><span class="u cb"></span><input id="deal" type="text" inputmode="numeric" value="30000"><span class="u ca"></span></div>
        </div>
        <input id="dealR" type="range" min="0" max="1000" step="1">
      </div>
      <div class="toggle">
        <label for="halve"><span data-i18n="halve"></span><span class="h" data-i18n="halve_h"></span></label>
        <div class="switch"><input id="halve" type="checkbox" role="switch" checked><i></i></div>
      </div>
    </aside>

    <aside class="panel inspector" id="inspector" aria-live="polite">
      <p class="ins-k"><i></i><span id="ins-kt"></span></p>
      <h3 id="ins-t"></h3>
      <p id="ins-p"></p>
      <div class="mathline" id="ins-m"></div>
      <div class="stepper">
        <div class="dots" id="ins-dots"></div>
        <div class="nav">
          <button type="button" id="prev" aria-label="Previous"><svg viewBox="0 0 12 12"><path d="M8 1 3 6l5 5"/></svg></button>
          <button type="button" id="next" aria-label="Next"><svg viewBox="0 0 12 12"><path d="M4 1l5 5-5 5"/></svg></button>
        </div>
      </div>
      <div class="say">
        <h4 data-i18n="say">Line to say on the call</h4>
        <p id="line"></p>
        <button class="copy" id="copy" type="button" data-i18n="copy">Copy the line</button>
      </div>
    </aside>
  </section>

  <section class="full">
    <h2 data-i18n="full_title">The numbers</h2>
    <div class="numbers">
      <div class="panel">
        <p class="sec-label" data-i18n="math_title">The math</p>
        <div class="mrow c"><span class="ml" data-i18n="m_cold"></span><span class="res" id="r-cold"></span><span class="eq" id="e-cold"></span></div>
        <div class="mrow"><span class="ml" data-i18n="m_value"></span><span class="res" id="r-value"></span><span class="eq" id="e-value"></span></div>
        <div class="mrow hl"><span class="ml" data-i18n="m_price"></span><span class="res" id="r-price"></span><span class="eq" id="e-price"></span></div>
      </div>
      <div class="panel">
        <div class="proj-top"><p class="sec-label" data-i18n="bar_title">One signed project</p><b id="p-deal"></b></div>
        <div class="bar" aria-hidden="true"><div class="cost" id="bar-cost"></div><div class="keep"></div></div>

          <div class="a"><span id="l-cost"></span><small id="l-cost-eq"></small></div>
          <div class="b"><span id="l-keep"></span></div>
        </div>
        <div class="roi"><b id="roi"></b><span data-i18n="roi_h"></span></div>
      </div>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</div>

/* annular sector (a slice of the coin, hub excluded) from angle 0 to a, extruded toward the viewer */
function sectorGeo(a){
  const R=COIN.R, r0=COIN.r0, D=COIN.D; a=Math.max(a,2e-4);
  const sh=new THREE.Shape(), seg=Math.max(2,Math.ceil(a/(Math.PI/40)));
  sh.moveTo(r0,0); sh.lineTo(R,0);
  for(let i=1;i<=seg;i++){ const q=a*i/seg; sh.lineTo(Math.cos(q)*R,Math.sin(q)*R); }
  sh.lineTo(Math.cos(a)*r0,Math.sin(a)*r0);
  for(let i=seg-1;i>=0;i--){ const q=a*i/seg; sh.lineTo(Math.cos(q)*r0,Math.sin(q)*r0); }
  const bev=a*r0>.22;
  const g=new THREE.ExtrudeGeometry(sh,{depth:D,bevelEnabled:bev,bevelThickness:.07,bevelSize:.06,bevelOffset:-.06,bevelSegments:2,curveSegments:1,steps:1});
  g.translate(0,0,-D/2); g.computeVertexNormals(); return g;
}

/* where each piece wants to be for the current step */
function target(part,i,s,now){

    rot=isF?s.fA:s.kA;

    else if(st==="price"){ exp=.16; bri=.5; if(i===0){ if(isF){ exp=1.15; pop=1.4; bri=1.9+.35*Math.sin(now/230); } else { exp=.6; bri=.8; } } }

/* ---------- frame loop ---------- */
const DTMAX=(window.__P3D_TEST&&window.__P3D_TEST.dtMax)||.05;
function loop(now){

  if(!G.ok||!G.visible||G.hidden){ G.last=now; G.qSkip=now; return; }
  const ft=now-G.last, dt=Math.min(DTMAX,ft/1000); G.last=now; const T=now/1000;
  adaptQuality(now,ft);
  if(PLAY.on) stepPlay(dt,now);
  if(G.build&&now>G.build.t0+4500) G.build=null;
  G.floor.material.uniforms.uTime.value=T;
  if(G.coinG){
    const idle=!G.dragging&&!reduce;
    G.coinG.rotation.y=idle?Math.sin(T*.35)*.09:G.coinG.rotation.y*.95;
    G.coinG.rotation.x=idle?Math.sin(T*.27)*.03:0;
    animCoin(dt,now);
    if(G.halo) G.halo.rotation.z=-T*.05;
    G.padRing.material.color.copy(G.COL.amber).multiplyScalar(.7+.25*Math.sin(T*1.6));
  }

  /* sparks */
  { const S=G.sparks, a=S.p.geometry.attributes, p=a.position.array, c=a.aColor.array, sz=a.aSize.array;
    for(let i=0;i<S.K;i++){
      if(S.life[i]<=0){ sz[i]=0; continue; }
      S.life[i]-=dt*1.1; S.vel[i*3+1]-=8*dt;
      p[i*3]+=S.vel[i*3]*dt; p[i*3+1]=Math.max(.05,p[i*3+1]+S.vel[i*3+1]*dt); p[i*3+2]+=S.vel[i*3+2]*dt;
      const l=Math.max(0,S.life[i]); c[i*3]=S.col[i*3]*l; c[i*3+1]=S.col[i*3+1]*l; c[i*3+2]=S.col[i*3+2]*l; sz[i]=2.6*l+.4;
    }
    a.position.needsUpdate=a.aColor.needsUpdate=a.aSize.needsUpdate=true; }

  G.cam.position.sub(G.swayCur); G.ctl.update();

    const dist=G.cam.position.distanceTo(G.ctl.target), k=dist*.012, right=G._r||(G._r=new THREE.Vector3()), up=G._u||(G._u=new THREE.Vector3());

    G.sway.copy(right).multiplyScalar((G.mouse.x*1.1+Math.sin(T*.13)*.5)*k).addScaledVector(up,(G.mouse.y*.5+Math.sin(T*.11)*.2)*k);

  G.comp.render();

}

  G.ema=G.ema?G.ema*.95+ft*.05:ft;
  if(G.ema<34||now-(G.qT||0)<2500) return;
  G.qT=now; G.ema=0;

const LBL={};

function labelText(){
  const m=M; if(!LBL.coin) return;
  const set=(k,sp,b,em)=>{ const L=LBL[k]; L.sp.textContent=sp; L.b.textContent=b; if(em){ L.em.textContent=em; L.em.hidden=false; } else L.em.hidden=true; L.h=0; };
  set("coin",t("lab_coin"),mC(m.deal));
  set("tokens",t("lab_tokens"),nFmt(m.nMeet));
  set("meeting",t("lab_meeting"),money(m.value));
  set("price",t("lab_price"),money(m.price),`${pct(m.cut)} × ${money(m.value)}`);
  set("wedge",t("lab_wedge"),money(m.cost),`${pct(m.cut)} · ${nFmt(m.nMeet)} × ${money(m.price)}`);
  set("keep",t("lab_keep"),money(m.keep));
}
const SHOW={project:["coin","tokens"],meeting:["meeting","coin"],price:["price"],total:["wedge","keep"]};
const DIM={meeting:["coin"]};
let tmpV=null;
function placeLabels(){
  if(!G.ok||!G.coinG) { for(const k in LBL) LBL[k].el.hidden=true; return; }
  const B=G.box; if(!B) return; if(!tmpV) tmpV=new THREE.Vector3();
  G.coinG.updateMatrixWorld();
  const show=new Set(SHOW[STEP]||[]), dim=new Set(DIM[STEP]||[]);
  if(G.hoverIdx>=0&&!PLAY.on) show.add("hover");
  for(const k in LBL){
    const L=LBL[k]; if(!show.has(k)){ L.el.hidden=true; continue; }
    const v=tmpV.set(L.v[0],L.v[1],L.v[2]).applyMatrix4(G.coinG.matrixWorld).project(G.cam);
    if(v.z>1||Math.abs(v.x)>1.15||Math.abs(v.y)>1.15){ L.el.hidden=true; continue; }
    let sx=(v.x*.5+.5)*B.W, sy=(-v.y*.5+.5)*B.H;
    if(!L.h){ L.el.hidden=false; L.h=L.el.offsetHeight||72; L.w=L.el.offsetWidth||180; }
    let mode=L.mode;
    if(mode==="s"){ const right=B.desk?B.W-B.off-16:B.W-8; if(sx+L.w>right) mode="a"; }
    if(mode==="a") sy=Math.max(B.top+L.h+6,sy); else sy=clamp(sy,B.top+L.h/2+6,B.H-B.bottom-L.h/2-6);
    if(B.desk&&sx>B.W-B.off-30&&sy<B.insB+40){ L.el.hidden=true; continue; }
    L.el.hidden=false; L.el.classList.toggle("dim",dim.has(k));
    L.el.classList.toggle("side",mode==="s"); L.el.classList.toggle("above",mode==="a"&&LDEF[k].cls.includes("above")||(mode==="a"&&L.mode==="s"));
    L.el.style.transform=mode==="s"?`translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) translate(0,-50%)`:`translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) translate(-50%,${mode==="a"?"-100%":"-50%"})`;
  }
}

/* ---------- camera ---------- */
function flyTo(k,instant){
  if(!G.ok) return; const f=framing(k);
  if(instant||reduce||!window.gsap){ if(window.gsap){ gsap.killTweensOf(G.cam.position); gsap.killTweensOf(G.ctl.target); } G.cam.position.copy(f.p); G.ctl.target.copy(f.t); G.ctl.update(); G.flying=false; return; }
  G.flying=true; gsap.killTweensOf(G.cam.position); gsap.killTweensOf(G.ctl.target);
  gsap.to(G.cam.position,{x:f.p.x,y:f.p.y,z:f.p.z,duration:1.5,ease:"power3.inOut"});
  gsap.to(G.ctl.target,{x:f.t.x,y:f.t.y,z:f.t.z,duration:1.5,ease:"power3.inOut",onComplete:()=>{ G.flying=false; }});
}
function intro(){
  const f=framing(STEP);
  if(reduce||!window.gsap){ flyTo(STEP,true); return; }
  const off=f.p.clone().sub(f.t), a=.55, ca=Math.cos(a), sa=Math.sin(a);
  G.cam.position.set(off.x*ca+off.z*sa,off.y+6,-off.x*sa+off.z*ca).multiplyScalar(1.7).add(f.t); G.ctl.target.copy(f.t); G.ctl.update();
  G.flying=true;
  gsap.to(G.cam.position,{x:f.p.x,y:f.p.y,z:f.p.z,duration:2.8,ease:"power3.out",onComplete:()=>{ G.flying=false; }});
}

/* ---------- pointer: hover a slice ---------- */
function bindPointer(){
  const el=G.R.domElement, ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
  const pick=e=>{
    const r=el.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,G.cam);
    const objs=[G.feeMesh,G.keepMesh,G.feeP,G.keepP].filter(Boolean); const hit=ray.intersectObjects(objs,false)[0];
    if(!hit) return -1; if(hit.object===G.feeP||hit.object===G.keepP) return G.nSl-1; return hit.instanceId??-1;
  };
  const setHover=i=>{ G.hoverIdx=i; el.classList.toggle("hov",i>=0); if(i>=0) hoverLabel(i); };
  el.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"){ setHover(pick(e)); const r=el.getBoundingClientRect(); G.mouse.x=((e.clientX-r.left)/r.width)*2-1; G.mouse.y=((e.clientY-r.top)/r.height)*2-1; } });
  el.addEventListener("pointerdown",e=>{ down={x:e.clientX,y:e.clientY}; G.dragging=true; if(window.gsap&&G.flying){ gsap.killTweensOf(G.cam.position); gsap.killTweensOf(G.ctl.target); G.flying=false; } });
  el.addEventListener("pointerup",e=>{ G.dragging=false; if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6&&e.pointerType!=="mouse"){ const i=pick(e); setHover(i===G.hoverIdx?-1:i); } down=null; });
  el.addEventListener("pointercancel",()=>{ G.dragging=false; down=null; });
  el.addEventListener("pointerleave",()=>{ setHover(-1); G.mouse.x=G.mouse.y=0; });
}
G.hoverIdx=-1;
function hoverLabel(i){
  const m=M, s=G.slices[i]; if(!s||!LBL.hover) return;
  const b=s.a0-s.span/2, r=(COIN.r0+COIN.R)/2+.2, frac=i>=G.nFull?s.span/(G.slices[0].span):1;
  LBL.hover.v=[Math.cos(b)*r,Math.sin(b)*r,COIN.D/2+.4];
  const u=G.unit, from=i*u+1, to=Math.min(Math.ceil(m.nMeet),(i+1)*u);
  LBL.hover.sp.textContent=t("lab_slice",{i:u>1?`${from}–${to}`:String(i+1)});
  LBL.hover.b.textContent=money(m.value*u*frac);
  LBL.hover.em.textContent=t("lab_slice_fee",{price:money(m.price*u*frac)}); LBL.hover.em.hidden=false; LBL.hover.h=0;
}

/* ============================================================
   UI: steps, inspector, HUD, captions, play
   ============================================================ */
function buildSteps(){
  const box=$("steps"); box.textContent="";
  STEPS.forEach((k,i)=>{ const b=document.createElement("button"); b.type="button"; b.dataset.k=k; b.innerHTML=`<i>${i+1}</i><span>${t("st_"+k)}</span>`; b.title=t("st_"+k);
    b.setAttribute("aria-pressed",String(k===STEP)); b.addEventListener("click",()=>{ stopPlay(); setStep(k); }); box.appendChild(b); });
}
function setStep(k,opts={}){
  const prev=STEP; STEP=k;
  const idx=STEPS.indexOf(k);
  document.querySelectorAll("#steps button").forEach((b,i)=>{ b.setAttribute("aria-pressed",String(b.dataset.k===k)); b.classList.toggle("done",i<idx); });
  renderInspector(); caption();
  if(!opts.noFly) flyTo(k);
  if(k==="total"&&prev!=="total"&&G.ok&&G.coinG){ setTimeout(()=>{ if(STEP!=="total"||!G.coinG) return; const bw=Math.PI/2-Math.PI*M.cut, p=new THREE.Vector3(Math.cos(bw)*(COIN.R+1.2),Math.sin(bw)*(COIN.R+1.2),.4).applyMatrix4(G.coinG.matrixWorld); burst(p.x,p.y,p.z,G.COL.hot,22,1.3); },650); }
}
function renderInspector(){
  const m=M, k=STEP, B=v=>`<b>${v}</b>`;
  $("inspector").style.setProperty("--c",SCOL[k]);
  $("ins-kt").textContent=`${STEPS.indexOf(k)+1} · ${t("st_"+k)}`;
  $("ins-t").textContent=t("ins_"+k+"_t");
  let p="", math="";
  if(!m.ok){ p=t("empty"); }
  else if(k==="project"){ p=t("ins_project",{n:B(nFmt(m.nMeet)),deal:B(money(m.deal))}); math=m.halve?t("ins_project_m",{close:pct(m.close),cold:pct(m.cold),n:nFmt(m.nMeet)}):t("ins_project_m2",{close:pct(m.close),n:nFmt(m.nMeet)}); }
  else if(k==="meeting"){ p=t("ins_meeting",{n:B(nFmt(m.nMeet)),value:B(money(m.value))}); math=t("ins_meeting_m",{cold:pct(m.cold),deal:money(m.deal),value:money(m.value)}); }
  else if(k==="price"){ p=t("ins_price",{cut:B(pct(m.cut)),price:B(money(m.price))}); math=t("ins_price_m",{cut:pct(m.cut),value:money(m.value),price:money(m.price)}); }
  else { p=t("ins_total",{cost:B(money(m.cost)),deal:B(money(m.deal)),keep:B(money(m.keep)),roi:B(xFmt(m.roi))}); math=t("ins_total_m",{n:nFmt(m.nMeet),price:money(m.price),cost:money(m.cost),deal:money(m.deal),keep:money(m.keep)}); }
  $("ins-p").innerHTML=p; $("ins-m").textContent=math; $("ins-m").hidden=!math;
  const i=STEPS.indexOf(k); $("ins-dots").innerHTML=STEPS.map((_,j)=>`<span class="${j<=i?"on":""}"></span>`).join("");
}
let shownPrice;
function tweenPrice(to){
  const el=$("h-price"), from=shownPrice; shownPrice=to;
  if(reduce||from===undefined||from===to){ cancelAnimationFrame(el._r); el.textContent=money(to); return; }
  cancelAnimationFrame(el._r); const t0=performance.now(), dur=420;
  const step=tt=>{ const k=Math.min(1,(tt-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=money(from+(to-from)*e); if(k<1) el._r=requestAnimationFrame(step); };
  el._r=requestAnimationFrame(step);
}
let capHold=0;
function caption(){
  const el=$("caption"), m=M, on=m.ok&&(PLAY.on||performance.now()<capHold);
  if(!on){ el.classList.remove("on"); return; }
  const B=v=>`<b>${v}</b>`; let s="";
  if(STEP==="project") s=t("cap_project",{n:B(nFmt(m.nMeet)),deal:B(money(m.deal))});
  else if(STEP==="meeting") s=t("cap_meeting",{value:B(money(m.value))});
  else if(STEP==="price") s=t("cap_price",{cut:B(pct(m.cut)),price:B(money(m.price))});
  else s=t("cap_total",{cost:B(money(m.cost)),keep:B(money(m.keep)),roi:B(xFmt(m.roi))});
  if(el._s!==s){ el.innerHTML=s; el._s=s; }
  el.classList.add("on");
}
const DUR=[4.2,3.4,3.4,4.4];
function startPlay(){
  PLAY.on=true; PLAY.i=0; PLAY.t=0; $("cta").classList.remove("pulse");
  const n=Math.max(1,G.nSl||1), now=performance.now();
  G.build=reduce?null:{t0:now,ts:Math.min(.09,1.2/n)*1000,goldAt:1450,coinAt:1700,cs:Math.min(60,1100/n),goldBurst:false};
  if(G.tokSc) G.tokSc.fill(0);
  if(G.build) G.slices&&G.slices.forEach(s=>{ s.f.exp=s.k.exp=5; s.f.sc=s.k.sc=0; });
  setStep("project"); ctaState(); if(!G.ok) fallbackTick();
}
function stopPlay(){ if(!PLAY.on) return; PLAY.on=false; G.build=null; capHold=performance.now()+2500; ctaState(); caption(); }
function stepPlay(dt){
  PLAY.t+=dt; if(PLAY.t<DUR[PLAY.i]) return;
  PLAY.i++; PLAY.t=0;
  if(PLAY.i>=STEPS.length){ PLAY.on=false; capHold=performance.now()+6000; G.played=true; ctaState(); caption(); return; }
  setStep(STEPS[PLAY.i]);
}
function fallbackTick(){ let last=performance.now(); const tick=now=>{ if(!PLAY.on||G.ok) return; const dt=Math.min(DTMAX,(now-last)/1000); last=now; stepPlay(dt); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
function ctaState(){
  $("cta").classList.toggle("playing",PLAY.on);
  const label=PLAY.on?t("pause"):(G.played?t("replay"):t("play_cta"));
  $("cta-t").textContent=label; $("cta").setAttribute("aria-label",label);
  $("cta-ico").innerHTML=PLAY.on?'<path d="M1 0h3.5v14H1zM7.5 0H11v14H7.5z"/>':'<path d="M0 0 L12 7 L0 14 Z"/>';
}
$("cta").addEventListener("click",()=>{ if(PLAY.on) stopPlay(); else startPlay(); });
$("prev").addEventListener("click",()=>{ stopPlay(); const i=STEPS.indexOf(STEP); setStep(STEPS[(i-1+STEPS.length)%STEPS.length]); });
$("next").addEventListener("click",()=>{ stopPlay(); const i=STEPS.indexOf(STEP); setStep(STEPS[(i+1)%STEPS.length]); });
(function bindFs(){
  const st=$("studio"), ok=!!(document.fullscreenEnabled&&st.requestFullscreen); if(!ok) return; st.classList.add("fs-ok");
  $("fs").addEventListener("click",()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen().catch(()=>{}); }catch(e){} });
  document.addEventListener("fullscreenchange",()=>{ $("fs").setAttribute("aria-label",document.fullscreenElement?t("fs_off"):t("fs_on")); setTimeout(()=>{ measureOverlays(); resize(); },60); });
})();

/* ---------- numbers ---------- */
function update(){
  const m=M;
  if(!m.ok){
    $("h-price").textContent="—"; shownPrice=undefined; $("chain").innerHTML="";
    ["r-cold","r-value","r-price","p-deal","roi"].forEach(id=>$(id).textContent="—");
    ["e-cold","e-value","e-price","l-cost","l-cost-eq","l-keep"].forEach(id=>$(id).textContent="");
    $("line").textContent=t("empty"); renderInspector(); return;
  }
  tweenPrice(m.price);
  $("chain").innerHTML=m.halve
    ? `<em>${pct(m.close)}</em>÷ 2<em>${pct(m.cold)}</em>× ${mC(m.deal)} =<em>${money(m.value)}</em>× ${pct(m.cut)} =<em class="w">${money(m.price)}</em>`
    : `<em>${pct(m.close)}</em>× ${mC(m.deal)} =<em>${money(m.value)}</em>× ${pct(m.cut)} =<em class="w">${money(m.price)}</em>`;
  $("r-cold").textContent=pct(m.cold); $("e-cold").textContent=m.halve?`${pct(m.close)} ÷ 2`:pct(m.close);
  $("r-value").textContent=money(m.value); $("e-value").textContent=`${pct(m.cold)} × ${money(m.deal)}`;
  $("r-price").textContent=money(m.price); $("e-price").textContent=`${pct(m.cut)} × ${money(m.value)}`;
  $("p-deal").textContent=money(m.deal);
  const share=clamp(m.cut*100,.5,100), segs=Math.min(60,Math.max(1,Math.round(m.nMeet)));
  const bc=$("bar-cost"); bc.style.flexBasis=share+"%"; bc.style.setProperty("--seg",(100/segs)+"%");
  $("l-cost").textContent=t("bar_cost",{cost:money(m.cost)});
  $("l-cost-eq").textContent=`≈ ${nFmt(m.nMeet)} ${t("meetings")} × ${money(m.price)}`;
  $("l-keep").textContent=t("bar_keep",{keep:money(m.keep)});
  $("roi").textContent=xFmt(m.roi)+"×";
  $("line").textContent=t("line",{price:money(m.price),cost:money(m.cost),deal:money(m.deal)});
  $("foot").textContent=m.halve?t("foot"):t("foot_nohalve");
  renderInspector(); labelText();
}
let rebuildT=0;
function recompute(){ M=model(); update(); caption(); clearTimeout(rebuildT); rebuildT=setTimeout(()=>{ rebuild(); },50); }
function paintR(id){ const R=$(id); const p=(R.value-R.min)/(R.max-R.min)*100; R.style.setProperty("--p",clamp(p,0,100)+"%"); }
function syncAll(){
  $("cut").value=S.cut; $("cutR").value=Math.min(50,S.cut); paintR("cutR");
  $("close").value=S.close; $("closeR").value=Math.min(80,S.close); paintR("closeR");
  $("deal").value=fmt(S.deal); $("dealR").value=fromLog(Math.max(S.deal,RANGE[0])); paintR("dealR");
}
[["cut",50],["close",80]].forEach(([k,max])=>{
  $(k+"R").addEventListener("input",()=>{ S[k]=+$(k+"R").value; $(k).value=S[k]; paintR(k+"R"); recompute(); });
  $(k).addEventListener("input",()=>{ S[k]=Math.min(99,pctNum($(k).value)); if(S[k]){ $(k+"R").value=Math.min(max,S[k]); paintR(k+"R"); } recompute(); });
});
$("dealR").addEventListener("input",()=>{ S.deal=round2(toLog(+$("dealR").value)); $("deal").value=fmt(S.deal); paintR("dealR"); recompute(); });
$("deal").addEventListener("input",()=>{ S.deal=moneyDigits($("deal").value); if(S.deal){ $("dealR").value=fromLog(Math.max(S.deal,RANGE[0])); paintR("dealR"); } recompute(); });
$("deal").addEventListener("blur",()=>{ if(S.deal) $("deal").value=fmt(S.deal); });
$("halve").addEventListener("input",recompute);
$("copy").addEventListener("click",()=>{
  const txt=$("line").textContent, btn=$("copy");
  const done=()=>{ btn.textContent=t("copied"); setTimeout(()=>btn.textContent=t("copy"),1500); };
  const sel=()=>{ const r=document.createRange(); r.selectNodeContents($("line")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
  try{ navigator.clipboard.writeText(txt).then(done,sel); }catch(e){ sel(); }
});
function buildSelects(){
  $("lang").innerHTML=Object.entries(I18N).map(([k,v])=>`<option value="${k}"${k===LANG?" selected":""}>${v.name}</option>`).join("");
  let dn=null; try{ dn=new Intl.DisplayNames([LOC()],{type:"currency"}); }catch(e){}
  const name=c=>{ try{ return dn?dn.of(c):c; }catch(e){ return c; } };
  let all=[]; try{ all=Intl.supportedValuesOf("currency"); }catch(e){}
  const popular=["USD","EUR","GBP","CAD","AUD","CHF","JPY","INR","BRL","MXN","AED","SGD","ZAR","NGN","MAD","SAR","SEK","PLN","NZD","HKD"];
  const rest=all.filter(c=>!popular.includes(c)).sort();
  const opt=c=>`<option value="${c}"${c===CUR?" selected":""}>${c} · ${name(c)}</option>`;
  $("cur").innerHTML=`<optgroup label="${t("popular")}">${popular.map(opt).join("")}</optgroup>`+(rest.length?`<optgroup label="${t("all")}">${rest.map(opt).join("")}</optgroup>`:"");
  if(!$("cur").value){ CUR="USD"; $("cur").value="USD"; }
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  const cp=curParts();
  document.querySelectorAll(".val .cb").forEach(e=>e.textContent=cp.before?cp.sym:"");
  document.querySelectorAll(".val .ca").forEach(e=>e.textContent=cp.before?"":cp.sym);
  $("hint").textContent=coarse?t("hint_touch"):t("hint");
  $("vp").setAttribute("aria-label",t("vp_label"));
  $("fs").setAttribute("aria-label",t("fs_on")); $("fs").title=t("fs_on");
  ["cut","close","deal"].forEach(k=>{ const lab=document.querySelector(`label[for=${k}R]`); if(lab) lab.title=t(k+"_h"); });
  buildSelects(); buildSteps(); buildLabels(); syncAll(); ctaState();
  if(G.R) G.R.domElement.setAttribute("aria-label",t("vp_label"));
}
$("lang").addEventListener("change",e=>{ LANG=e.target.value; store.set("ppm-lang",LANG); shownPrice=undefined; applyI18n(); recompute(); });
$("cur").addEventListener("change",e=>{ CUR=e.target.value; store.set("ppm-cur",CUR); shownPrice=undefined; applyI18n(); recompute(); });
function measureOverlays(){
  document.documentElement.style.setProperty("--hdr",document.querySelector(".top").offsetHeight+"px");
  const st=$("studio"); st.style.setProperty("--ch",$("console").offsetHeight+"px"); st.style.setProperty("--tph",$("tp").offsetHeight+"px");
}

/* ---------- boot ---------- */
applyI18n();
M=model(); update(); renderInspector();
measureOverlays();
new ResizeObserver(()=>measureOverlays()).observe($("console"));
new ResizeObserver(()=>measureOverlays()).observe(document.querySelector(".top"));
init3D();
setStep(STEP,{noFly:true});
})();
</script>
