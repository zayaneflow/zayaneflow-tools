<style>
/* A 3D "program monitor" of the outreach machine: inboxes → market planet → calendar → vault.
   HUD numbers top-left, inspector top-right, transport + captions above a fader console at the bottom,
   detailed 60-day tracks and the full plan below the fold. Teal-to-amber grade: cold leads warm up into money.
   Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#05070a; --panel:#11161a; --panel-2:#171e24; --inset:#06080a;
  --glass:rgba(11,15,19,.74); --line:#222a31; --line-2:#34404a;
  --fg:#eaedef; --muted:#8e99a1; --faint:#5f6b75;
  --deep:#4a8db5; --mid:#44a6c6; --cold:#41b6cc; --warm:#f0a03c; --hot:#ffd57f;
  --on-warm:#1c1206; --warm-soft:rgba(240,160,60,.12);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:radial-gradient(1200px 600px at 50% -10%, rgba(65,182,204,.07), transparent 60%),var(--bg);
  color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 56px;min-height:100%;
}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:1600px;margin:0 auto;display:grid;gap:12px}
.shell>*,.top>*,.studio>*{min-width:0}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;min-width:0}
.logo{width:32px;height:32px;flex:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.chips{display:flex;gap:4px;padding:3px;background:var(--inset);border:1px solid var(--line);border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:12.5px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.chips button i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--cold));box-shadow:0 0 8px var(--c,var(--cold))}
.chips button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.sel{appearance:none;-webkit-appearance:none;background:var(--inset) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238e99a1' stroke-width='1.5'/></svg>") no-repeat right 12px center;
  border:1px solid var(--line);border-radius:999px;color:var(--fg);font-size:13px;font-weight:500;padding:7px 30px 7px 12px;max-width:190px;cursor:pointer}
.sel option,.sel optgroup{background:#13181c;color:var(--fg)}
@media (max-width:620px){ .top{gap:10px} .mark span{font-size:11px;letter-spacing:.12em} .chips{order:3;width:100%} .ctrls{margin-left:auto} .sel{max-width:150px;font-size:12.5px} }

/* studio */
.studio{position:relative;display:grid;gap:12px}
.viewport{position:relative;height:clamp(480px,132vw,640px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#05070a;
  box-shadow:0 30px 80px -40px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.02);touch-action:pan-y}
@media (min-width:640px){ .viewport{height:clamp(540px,74vh,760px)} }
.viewport canvas.gl{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:grab;outline:none}
.viewport canvas.gl.hov{cursor:pointer}
.viewport canvas.gl:active{cursor:grabbing}
.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.5) 100%),
    linear-gradient(var(--line-2),var(--line-2)) 12px 12px/20px 1.5px no-repeat,
    linear-gradient(var(--line-2),var(--line-2)) 12px 12px/1.5px 20px no-repeat,
    linear-gradient(var(--line-2),var(--line-2)) calc(100% - 12px) 12px/20px 1.5px no-repeat,
    linear-gradient(var(--line-2),var(--line-2)) calc(100% - 13.5px) 12px/1.5px 20px no-repeat}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:none;border:0;padding:6px 8px 0;color:var(--fg);text-align:center;
  display:grid;justify-items:center;gap:2px;will-change:transform;transition:opacity .25s}
.lbl b{font-family:var(--display);font-weight:800;font-size:28px;line-height:.9;letter-spacing:.01em;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.95)}
.lbl span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#a6b0b7;text-shadow:0 1px 8px #000;white-space:nowrap}
.lbl::after{content:"";width:1px;height:18px;background:linear-gradient(var(--c,var(--cold)),transparent);margin-top:3px}
.lbl.dim{opacity:.28}
.lbl[hidden]{display:none}
.hud{position:absolute;left:20px;top:18px;right:20px;pointer-events:none;display:grid;gap:8px;justify-items:start}
.hud .eyebrow{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chain{display:flex;align-items:flex-end;gap:12px;flex-wrap:nowrap;max-width:100%;--hf:62px}
.link{display:grid;gap:6px;min-width:0}
.link b{font-family:var(--display);font-weight:900;font-size:var(--hf);line-height:.82;font-variant-numeric:tabular-nums;white-space:nowrap;
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:3px}
.link span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.k-meet b{background-image:linear-gradient(180deg,#9aeaf6 0%,var(--cold) 55%,#2a7f95 100%)}
.k-proj b{background-image:linear-gradient(180deg,#ffd9a1 0%,var(--warm) 55%,#b8661a 100%)}
.k-rev b{background-image:linear-gradient(180deg,#fff6dc 0%,var(--hot) 50%,#e39a33 100%);filter:drop-shadow(0 0 26px rgba(255,213,127,.35))}
.op{font-family:var(--mono);font-size:10.5px;color:var(--fg);background:rgba(12,16,20,.8);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;white-space:nowrap;margin-bottom:24px;flex:none}

.caption{position:absolute;left:50%;bottom:calc(var(--tph,58px) + 24px);transform:translate(-50%,6px);width:max-content;max-width:min(640px,calc(100% - 28px));
  text-align:center;font-size:15px;font-weight:500;line-height:1.4;color:var(--fg);background:rgba(7,10,13,.8);border:1px solid var(--line-2);border-radius:12px;
  padding:9px 15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-wrap:balance}
.caption.on{opacity:1;transform:translate(-50%,0)}
.caption b{color:var(--hot);font-weight:600}

.transport3{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:12px;padding:7px 16px 7px 7px;background:rgba(7,10,13,.8);
  border:1px solid var(--line-2);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tp-play{position:relative;flex:none;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--on-warm);
  background:linear-gradient(180deg,var(--hot),var(--warm));border:0;border-radius:999px;padding:10px 18px 10px 15px;cursor:pointer;box-shadow:0 8px 30px -8px rgba(240,160,60,.65);white-space:nowrap}
.tp-play svg{width:12px;height:12px;fill:currentColor;flex:none}
.tp-play.playing{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.tp-play.pulse::before{content:"";position:absolute;inset:-5px;border-radius:999px;border:2px solid rgba(255,213,127,.55);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.tp-day{display:grid;line-height:1;gap:3px;flex:none}
.tp-day span,.tp-val span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tp-day b{font-family:var(--display);font-weight:800;font-size:24px;color:var(--hot);font-variant-numeric:tabular-nums;min-width:2.2ch}
.tp-bar{position:relative;flex:1;min-width:60px;height:30px;cursor:ew-resize;touch-action:none}
.tp-bar:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:6px}
.tp-bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--line-2)}
.tp-warm{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--warm) 0 2px,transparent 2px 5px);opacity:.75}
.tp-fill{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--hot))}
.tp-ticks i{position:absolute;top:50%;width:2px;height:12px;margin:-6px 0 0 -1px;border-radius:1px;background:var(--cold);opacity:.35}
.tp-ticks i.on{opacity:1;box-shadow:0 0 6px var(--cold)}
.tp-head{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 4px rgba(255,213,127,.2),0 0 16px rgba(255,213,127,.6)}
.tp-val{display:grid;line-height:1;gap:3px;text-align:right;flex:none;min-width:64px}
.tp-val b{font-family:var(--display);font-weight:800;font-size:24px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.tp-fs{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--inset);color:var(--fg);display:none;place-items:center;cursor:pointer}
.tp-fs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.tp-fs:hover{border-color:var(--muted)}
@media (min-width:1080px){ .fs-ok .tp-fs{display:grid} }
.studio:fullscreen{height:100vh!important;max-height:none;background:var(--bg)}
.studio:fullscreen .viewport{border-radius:0;border:0}
.vnotes{position:absolute;right:18px;bottom:calc(var(--tph,58px) + 26px);display:grid;gap:3px;text-align:right;font-family:var(--mono);font-size:9.5px;color:var(--faint);pointer-events:none;max-width:46%}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:14px;
  background:radial-gradient(circle at 50% 45%, rgba(65,182,204,.12), transparent 60%)}
.nogl p{max-width:42ch;margin:0}
@media (max-width:620px){
  .caption{font-size:13.5px;padding:8px 12px}
  .tp-play span{display:none}
  .tp-play{padding:11px 13px}
  .tp-day b,.tp-val b{font-size:21px}
  .transport3{gap:10px;padding-right:14px}
  .lbl b{font-size:21px}
  .lbl span{font-size:8.5px}
  .vnotes{display:none}
  .hud{left:16px;top:14px;right:16px}
  .link span{white-space:normal;font-size:8.5px;letter-spacing:.1em;line-height:1.25}
  .link{flex:0 1 auto}
  .op{margin-bottom:30px;padding:2px 7px;font-size:9.5px}
  .chain{gap:8px}
}

/* glass panels */
.panel{background:linear-gradient(180deg,rgba(23,30,36,.92),rgba(14,19,23,.94));border:1px solid var(--line);border-radius:14px;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 60px -28px rgba(0,0,0,.8)}
.console{padding:14px 16px 16px;display:grid;gap:16px}
.c-head{display:grid;gap:9px;align-content:start}
.c-head h2,.ins-k{margin:0;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.presets{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--inset);color:var(--muted);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--warm);color:var(--hot);background:var(--warm-soft)}
.ctl{display:grid;gap:4px;min-width:0}
.ctl-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ctl label{font-weight:600;font-size:13.5px;line-height:1.25;min-width:0}
.ctl .hint2{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
.val{display:flex;align-items:baseline;gap:2px;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;flex:none}
.val .u{color:var(--faint);font-size:19px}
.val input{width:8.6ch;font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--line-2);text-align:right;padding:0 0 2px;font-variant-numeric:tabular-nums}
.val input.short{width:3.2ch}
.val input:focus{outline:none;border-bottom-color:var(--hot)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer}
input[type=range]:focus-visible{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--warm)) 0 0/var(--p,50%) 100% no-repeat,var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--warm))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:26px;margin-top:-11px;border:0;border-radius:4px;
  background:linear-gradient(180deg,#f3f5f7 0 45%,#272d34 45% 55%,#c6cdd3 55% 100%);box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:16px;height:26px;border:0;border-radius:4px;background:linear-gradient(180deg,#f3f5f7 0 45%,#272d34 45% 55%,#c6cdd3 55% 100%)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--hot)}

.inspector{padding:16px;display:grid;gap:11px;align-content:start}
.ins-k{display:flex;align-items:center;gap:8px;color:var(--c,var(--cold))}
.ins-k i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--cold));box-shadow:0 0 10px var(--c,var(--cold))}
.inspector h3{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em}
.inspector p{margin:0;color:#c9d1d6;font-size:14px;line-height:1.55}
.inspector p b{color:var(--hot);font-weight:600}
.mathline{font-family:var(--mono);font-size:11.5px;color:var(--fg);background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:9px 11px;line-height:1.6;overflow-wrap:anywhere}
.mathline[hidden]{display:none}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:5px}
.dots span{width:18px;height:3px;border-radius:2px;background:var(--line-2)}
.dots span.on{background:var(--c,var(--cold))}
.nav{display:flex;gap:6px}
.nav button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--inset);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.nav button:hover{border-color:var(--muted)}
.nav svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

@media (min-width:1080px){
  .studio{display:block;height:clamp(640px,calc(100vh - var(--hdr,52px) - 36px),980px)}
  .viewport{position:absolute;inset:0;height:auto}
  .console{position:absolute;left:16px;right:16px;bottom:16px;grid-template-columns:auto repeat(3,minmax(0,1fr));align-items:end;gap:30px;padding:13px 20px 14px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .console .hint2{display:none}
  .inspector{position:absolute;right:16px;top:16px;width:340px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .transport3{left:28px;right:384px;bottom:calc(var(--ch,96px) + 30px)}
  .caption{left:calc((100% - 356px)/2);bottom:calc(var(--ch,96px) + var(--tph,58px) + 46px)}
  .vnotes{right:28px;bottom:calc(var(--ch,96px) + 34px);max-width:330px}
  .hud{right:390px;left:24px;top:22px}
}
@media (max-width:1079px){ .inspector{order:1} .console{order:2} }

/* timeline */
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.transport{display:flex;align-items:center;gap:8px}
.tc{display:grid;gap:1px;background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:4px 10px 5px;min-width:58px}
.tc span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tc b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--hot);font-variant-numeric:tabular-nums;white-space:nowrap}
.tc.r{min-width:110px}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--warm);background:var(--warm-soft);color:var(--hot);display:grid;place-items:center;cursor:pointer}
.play svg{width:12px;height:12px;fill:currentColor}
.stage{padding:10px 14px 2px;min-width:0;touch-action:none;cursor:ew-resize}
.stage:focus-visible{outline:2px solid var(--hot);outline-offset:-2px;border-radius:8px}
.stage svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:6px 16px 12px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:7px;height:14px;border-radius:2px;background:var(--cold)}
.legend i.r{width:16px;height:2px;background:var(--hot)}
.legend i.w{width:16px;background:repeating-linear-gradient(135deg,var(--warm) 0 2px,transparent 2px 5px);border:1px solid rgba(240,160,60,.5)}
.legend #unit-note:empty{display:none}
.bed{fill:rgba(255,255,255,.022);stroke:var(--line)} .band{fill:rgba(255,255,255,.025)}
.rl{stroke:var(--line-2)} .tick{stroke:var(--faint)} .tick.mn{stroke:var(--line-2)}
.rlab{fill:var(--muted);font-family:var(--mono);font-size:9.5px}
.gl{fill:var(--faint);font-family:var(--mono);font-size:9px;letter-spacing:.12em}
.tcode{fill:var(--faint);font-family:var(--mono);font-size:9px}
.tname{fill:var(--fg);font-family:var(--sans);font-size:12px;font-weight:500}
.mk{fill:var(--cold)} .mk.part{fill:none;stroke:var(--cold);stroke-dasharray:2 2}
.ph-warm{fill:url(#hatch);stroke:var(--warm);stroke-opacity:.5}
.ph-send{fill:rgba(65,182,204,.13);stroke:var(--cold);stroke-opacity:.55}
.phtxt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em} .phtxt.w{fill:var(--warm)} .phtxt.s{fill:var(--cold)}
.wnote{fill:var(--faint);font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}
.fsend{stroke:var(--cold);stroke-dasharray:3 4;opacity:.55}
.base{stroke:var(--line-2)} .goal{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.glabel{fill:var(--muted);font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}
.area{fill:url(#revfill)} .rev{fill:none;stroke:var(--hot);stroke-width:2;stroke-linejoin:round}
.dimlayer{opacity:.16} .enddot{fill:var(--hot)} .phl{stroke:var(--hot);stroke-width:1.5} .phh{fill:var(--hot)}
.ahead{opacity:.16}

/* full plan */
.full{display:grid;gap:16px;padding-top:26px;border-top:1px dashed var(--line-2);margin-top:6px}
.full h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1;letter-spacing:.01em}
.full .subh{margin:6px 0 0;color:var(--muted)}
.sec-label{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sentence{margin:4px 0 0;font-size:clamp(17px,2vw,22px);font-weight:500;line-height:1.4;text-wrap:balance;max-width:66ch}
.sentence b{color:var(--hot);font-weight:600}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:center}
.fcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.fcell b{font-family:var(--display);font-weight:800;font-size:clamp(30px,3.6vw,46px);line-height:.85;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fcell span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.c0 b{color:var(--deep)} .c1 b{color:var(--mid)} .c2 b{color:var(--cold)} .c3 b{color:var(--warm)}
.fop{padding:0 8px;display:grid;place-items:center}
.fop em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--fg);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--inset)}
@media (max-width:840px){.flow{grid-template-columns:minmax(0,1fr)} .fop{place-items:start;padding:6px 0 6px 18px} .fop em::before{content:"↓ ";color:var(--muted)}}
.kit{display:flex;flex-wrap:wrap;gap:12px}
.tile{flex:1 1 170px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:800;font-size:clamp(36px,4.2vw,50px);line-height:.85;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile em{font-style:normal;font-size:12.5px;color:var(--muted)}
details.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.box summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;font-weight:600}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.box[open] summary::after{content:"−"}
.advlist{display:grid;border-top:1px solid var(--line)}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;min-height:52px}
.arow + .arow{border-top:1px solid var(--line)}
.arow label{flex:1;min-width:0;font-size:14px}
.arow label span.h{display:block;font-size:12px;color:var(--muted)}
.arow .f{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:var(--mono);font-size:12px}
.arow input[type=number]{width:76px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--fg);background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line-2);border-radius:28px;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch input:checked + i{background:var(--warm)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--hot);outline-offset:2px}
.reset{margin:12px 18px 16px;font-size:13px;color:var(--warm);background:none;border:0;padding:4px 0;cursor:pointer}
.tbl{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:580px}
th,td{text-align:left;padding:11px 18px}
th{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
tbody tr{border-top:1px solid var(--line)}
td.f{color:var(--muted);font-family:var(--mono);font-size:12px}
td.r{text-align:right;font-family:var(--mono);font-weight:500;white-space:nowrap}
td.r.hl{color:var(--hot)}
.foot{margin:0;font-size:12.5px;color:var(--faint);max-width:76ch}
@media (prefers-reduced-motion:reduce){.switch i,.switch i::after,.chip,.lbl,.caption{transition:none} .tp-play.pulse::before{animation:none}}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="logo" aria-hidden="true"><defs><linearGradient id="plg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#41b6cc"/><stop offset=".55" stop-color="#f0a03c"/><stop offset="1" stop-color="#ffd57f"/></linearGradient><linearGradient id="plb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2228"/><stop offset="1" stop-color="#0d1115"/></linearGradient></defs><rect x="1" y="1" width="46" height="46" rx="12" fill="url(#plb)" stroke="#2f3a43"/><path d="M9 16V9h7M32 9h7v7M39 32v7h-7M16 39H9v-7" fill="none" stroke="#5f6b75" stroke-width="2" stroke-linecap="round"/><path d="M13 33h6v-5h6v-5h6v-5h3" fill="none" stroke="url(#plg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35.5" cy="18" r="3.4" fill="#ffd57f"/><circle cx="35.5" cy="18" r="6" fill="#ffd57f" opacity=".18"/></svg><span data-i18n="brand">60-Day Booked Meetings Planner</span></div>
    <nav class="chips" id="chips" aria-label="Stations"></nav>
    <div class="ctrls">
      <label class="vh" for="lang" data-i18n="lang">Language</label><select id="lang" class="sel"></select>
      <label class="vh" for="cur" data-i18n="cur">Currency</label><select id="cur" class="sel"></select>
    </div>
  </header>

  <section class="studio" id="studio">
    <div class="viewport" id="vp" role="group">
      <div class="labels" id="labels"></div>
      <div class="hud" id="hud" aria-live="polite">
        <p class="eyebrow" data-i18n="eyebrow">Your first 60 days</p>
        <div class="chain" id="chain">
          <div class="link k-meet"><b id="h-meet">0</b><span id="h-meet-l"></span></div>
          <div class="op" id="h-close">× 10%</div>
          <div class="link k-proj"><b id="h-proj">0</b><span data-i18n="byday_proj"></span></div>
          <div class="op" id="h-deal">× 30K</div>
          <div class="link k-rev"><b id="h-rev">0</b><span id="h-rev-l"></span></div>
        </div>
      </div>
      <div class="vnotes" id="vnotes"><span id="hint"></span><span id="scaleNote"></span></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="transport3" id="tp">
        <button class="tp-play pulse" id="cta" type="button"><svg viewBox="0 0 12 14" aria-hidden="true" id="cta-ico"><path d="M0 0 L12 7 L0 14 Z"/></svg><span id="cta-t" data-i18n="play_cta">Play the 60 days</span></button>
        <div class="tp-day"><span data-i18n="day">Day</span><b id="tp-d">60</b></div>
        <div class="tp-bar" id="tpbar" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60">
          <i class="tp-warm" id="tp-warm"></i><span class="tp-ticks" id="tp-ticks"></span><i class="tp-fill" id="tp-fill"></i><i class="tp-head" id="tp-head"></i>
        </div>
        <div class="tp-val"><span data-i18n="pipeline">Pipeline</span><b id="tp-v">—</b></div>
        <button class="tp-fs" id="fs" type="button"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
      </div>
      <div class="nogl" id="nogl" hidden><p data-i18n="nogl"></p></div>
    </div>

    <aside class="panel console" id="console">
      <div class="c-head"><h2 data-i18n="your_numbers">Your numbers</h2><div class="presets" id="presets"></div></div>
      <div class="ctl">
        <div class="ctl-top">
          <label for="gapR"><span data-i18n="gap_l"></span><span class="hint2" data-i18n="gap_h"></span></label>
          <div class="val"><span class="u cb"></span><input id="gap" type="text" inputmode="numeric" value="120000"><span class="u ca"></span></div>
        </div>
        <input id="gapR" type="range" min="0" max="1000" step="1">
      </div>
      <div class="ctl">
        <div class="ctl-top">
          <label for="dealR"><span data-i18n="deal_l"></span><span class="hint2" data-i18n="deal_h"></span></label>
          <div class="val"><span class="u cb"></span><input id="deal" type="text" inputmode="numeric" value="30000"><span class="u ca"></span></div>
        </div>
        <input id="dealR" type="range" min="0" max="1000" step="1">
      </div>
      <div class="ctl">
        <div class="ctl-top">
          <label for="closeR"><span data-i18n="close_l"></span><span class="hint2" data-i18n="close_h"></span></label>
          <div class="val"><input id="close" class="short" type="text" inputmode="decimal" value="10"><span class="u">%</span></div>
        </div>
        <input id="closeR" type="range" min="1" max="80" step="1" value="10">
      </div>
    </aside>

    <aside class="panel inspector" id="inspector" aria-live="polite">
      <div class="ins-k"><i></i><span id="ins-kt"></span></div>
      <h3 id="ins-t"></h3>
      <p id="ins-p"></p>
      <div class="mathline" id="ins-m"></div>
      <div class="stepper">
        <div class="dots" id="ins-dots"></div>
        <div class="nav">
          <button type="button" id="prev" aria-label="Previous"><svg viewBox="0 0 12 12"><path d="M8 1 3 6l5 5"/></svg></button>
          <button type="button" id="next" aria-label="Next"><svg viewBox="0 0 12 12"><path d="M4 1l5 5-5 5"/></svg></button>
        </div>
      </div>
    </aside>
  </section>

  <section class="panel tl">
    <div class="panel-head">
      <h2 data-i18n="year60">Your first 60 days, day by day</h2>
      <div class="transport">
        <div class="tc"><span data-i18n="day">Day</span><b id="tc-m">60</b></div>
        <div class="tc r"><span data-i18n="pipeline">Pipeline</span><b id="tc-r"></b></div>
        <button class="play" id="play" type="button"><svg viewBox="0 0 12 14" aria-hidden="true" id="play-ico"><path d="M0 0 L12 7 L0 14 Z"/></svg></button>
      </div>
    </div>
    <div class="stage" id="stage" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60"><svg id="tlsvg" role="img"></svg></div>
    <div class="legend">
      <span><i class="w"></i><span data-i18n="lg_warm"></span></span>
      <span><i></i><span data-i18n="lg_meet"></span></span>
      <span><i class="r"></i><span data-i18n="lg_pipe"></span></span>
      <span id="unit-note"></span>
    </div>
  </section>

  <section class="full">
    <div><h2 data-i18n="full_title">The full plan</h2><p class="subh" data-i18n="full_sub"></p></div>
    <div><p class="sec-label" data-i18n="behind60"></p><p class="sentence" id="sentence"></p></div>
    <p class="sec-label" data-i18n="every_month"></p>
    <div class="flow" id="flow"></div>
    <div class="kit">
      <div class="tile"><span class="k" data-i18n="k_boxes"></span><b id="o-boxes">0</b><em id="o-boxes-note"></em></div>
      <div class="tile"><span class="k" data-i18n="k_doms"></span><b id="o-doms">0</b><em id="o-doms-note"></em></div>
      <div class="tile"><span class="k" data-i18n="k_epd"></span><b id="o-epd">0</b><em data-i18n="n_epd"></em></div>
      <div class="tile"><span class="k" data-i18n="k_epm"></span><b id="o-epm">0</b><em id="o-epm-note"></em></div>
      <div class="tile"><span class="k" data-i18n="k_warm"></span><b id="o-warm">20</b><em data-i18n="n_warm"></em></div>
    </div>
    <details class="box" id="bench">
      <summary data-i18n="bench">Benchmarks &amp; sending setup</summary>
      <div class="advlist">
        <div class="arow"><label for="pos"><span data-i18n="b_pos"></span><span class="h" data-i18n="b_pos_h"></span></label><div class="f"><input id="pos" type="number" min="0.1" step="0.1" value="1">%</div></div>
        <div class="arow"><label for="book"><span data-i18n="b_book"></span><span class="h" data-i18n="b_book_h"></span></label><div class="f"><input id="book" type="number" min="1" max="100" step="1" value="33">%</div></div>
        <div class="arow"><label for="seq"><span data-i18n="b_seq"></span><span class="h" data-i18n="b_seq_h"></span></label><div class="f"><input id="seq" type="number" min="1" max="6" step="1" value="2"></div></div>
        <div class="arow"><label for="days"><span data-i18n="b_days"></span><span class="h" data-i18n="b_days_h"></span></label><div class="f"><input id="days" type="number" min="1" max="31" step="1" value="26"></div></div>
        <div class="arow"><label for="perbox"><span data-i18n="b_perbox"></span><span class="h" data-i18n="b_perbox_h"></span></label><div class="f"><input id="perbox" type="number" min="1" max="50" step="1" value="20"></div></div>
        <div class="arow"><label for="perdom"><span data-i18n="b_perdom"></span></label><div class="f"><input id="perdom" type="number" min="1" max="10" step="1" value="3"></div></div>
        <div class="arow"><label for="warm"><span data-i18n="b_warm"></span><span class="h" data-i18n="b_warm_h"></span></label><div class="f"><input id="warm" type="number" min="0" max="59" step="1" value="20"></div></div>
        <div class="arow"><label for="lag"><span data-i18n="b_lag"></span><span class="h" data-i18n="b_lag_h"></span></label><div class="f"><input id="lag" type="number" min="0" max="30" step="1" value="5"></div></div>
        <div class="arow"><label for="reserve"><span data-i18n="b_res"></span><span class="h" data-i18n="b_res_h"></span></label><div class="switch"><input id="reserve" type="checkbox" role="switch"><i></i></div></div>
      </div>
      <button class="reset" id="reset" type="button" data-i18n="reset"></button>
    </details>
    <details class="box">
      <summary data-i18n="math"></summary>
      <div class="tbl"><table>
        <thead><tr><th data-i18n="th_step"></th><th data-i18n="th_formula"></th><th style="text-align:right" data-i18n="th_result"></th></tr></thead>
        <tbody id="steps"></tbody>
      </table></div>
    </details>
    <p class="foot"><span data-i18n="foot_c"></span> <span data-i18n="illus"></span></p>
  </section>
</div>

(() => {

const I18N = {

const r1=n=>Math.round(n*10)/10;

/* ---------- model ---------- */
const S={gap:120000,deal:30000,close:10};
const num=id=>{ const v=parseFloat($(id).value); return isFinite(v)&&v>0?v:0; };
function model(){
  const gap=S.gap, deal=S.deal, close=S.close/100, pos=num("pos")/100, book=num("book")/100;
  const seq=num("seq"), days=num("days"), perbox=num("perbox"), perdom=num("perdom"), reserve=$("reserve").checked;
  const ok=!!(gap&&deal&&close&&pos&&book&&seq&&days&&perbox&&perdom)&&close<=1&&book<=1&&pos<=1;
  const dealsYr=ok?gap/deal:0, dealsMo=dealsYr/12, meetMo=ok?dealsMo/close:0, posMo=ok?meetMo/book:0;
  const leads=ok?Math.ceil(posMo/pos):0, epm=leads*seq, epd=ok?Math.ceil(epm/days):0;
  const send=ok?Math.ceil((epm/days)/perbox):0, boxes=reserve?send*2:send, doms=ok?Math.ceil(boxes/perdom):0;
  const intIn=(id,lo,hi,d)=>{ const v=parseFloat($(id).value); return isFinite(v)?Math.max(lo,Math.min(hi,Math.round(v))):d; };
  const warm=intIn("warm",0,59,20), lag=intIn("lag",0,30,5);
  const sendDays=Math.max(0,HZ-warm), bookStart=Math.min(HZ,warm+lag), bookDays=Math.max(0,HZ-bookStart);
  const leads60=Math.round(leads*sendDays/30), meet60=meetMo*bookDays/30, deals60=meet60*close, pipe60=deals60*deal;
  const firstMeet=meetMo>0?Math.max(bookStart+1,Math.ceil(bookStart+30/meetMo-1e-9)):Infinity;
  return {gap,deal,close,pos,book,seq,days,perbox,perdom,reserve,ok,dealsYr,dealsMo,meetMo,posMo,leads,epm,epd,send,boxes,doms,
    warm,lag,sendDays,bookStart,bookDays,leads60,meet60,deals60,pipe60,firstMeet};
}
/* values reached by a given day */
function at(m,d){
  const sendT=Math.max(0,Math.min(d,HZ)-m.warm), bookT=Math.max(0,Math.min(d,HZ)-m.bookStart);
  const leadsD=m.leads*sendT/30, repliesD=m.posMo*Math.max(0,sendT-1)/30, meetD=m.meetMo*bookT/30;
  return {leads:leadsD, replies:repliesD, meet:meetD, deals:meetD*m.close, pipe:meetD*m.close*m.deal};
}
function dailyMeetings(m){
  const c=new Array(HZ).fill(0); if(!m.ok) return c;
  const cum=x=>Math.max(0,x-m.bookStart)*m.meetMo/30;
  for(let d=0;d<HZ;d++) c[d]=Math.floor(cum(d+1)+1e-9)-Math.floor(cum(d)+1e-9);
  return c;
}

const shown={};
function tween(id,to,f){
  const el=$(id), from=shown[id]; shown[id]=to;
  if(reduce||from===undefined||from===to||PLAY.on||SCRUB){ cancelAnimationFrame(el._r); el.textContent=f(to); return; }
  cancelAnimationFrame(el._r); const t0=performance.now(), dur=420;
  const step=tt=>{ const k=Math.min(1,(tt-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=k<1?f(from+(to-from)*e):f(to); if(k<1) el._r=requestAnimationFrame(step); };
  el._r=requestAnimationFrame(step);
}

/* free area of the monitor (not covered by HUD, inspector, transport, console) */
function freeBox(){
  const vp=$("vp"), r=vp.getBoundingClientRect(), W=r.width, H=r.height, desk=W>=1080;
  const hud=$("hud").getBoundingClientRect(), tp=$("tp").getBoundingClientRect();
  const top=clamp(hud.bottom-r.top+8,40,H*.45), bottom=clamp(r.bottom-tp.top+(desk?54:44),60,H*.5);
  const off=desk?$("inspector").offsetWidth+16:0, insB=desk?$("inspector").getBoundingClientRect().bottom-r.top:0;
  return {W,H,desk,off,insB,top,bottom,availW:Math.max(180,W-off-(desk?60:20)),availH:Math.max(120,H-top-bottom)};
}
/* move the lens center into the free area: view offset left (inspector) and down/up (HUD vs transport) */
function applyView(){
  const B=freeBox(); if(!B.W||!B.H) return;
  const dy=Math.round((B.top-B.bottom)/2), fullW=B.W+B.off, fullH=B.H+2*Math.abs(dy);
  G.focal=(B.H/2)/Math.tan(19*Math.PI/180);
  G.cam.fov=2*Math.atan((fullH/2)/G.focal)*180/Math.PI;
  G.cam.aspect=fullW/fullH;
  if(B.off||dy) G.cam.setViewOffset(fullW,fullH,B.off,dy<0?2*Math.abs(dy):0,B.W,B.H); else G.cam.clearViewOffset();
  G.cam.updateProjectionMatrix();
  G.ptK=clamp(B.H/700,.7,1.25);
  G.box=B;
}
function framing(k){
  const B=G.box||freeBox(), portrait=B.W/B.H<.95;
  const v=VIEW[(k==="over"&&portrait)?"overP":k]||VIEW.over;
  const dist=clamp(Math.max(G.focal*v.S/B.availW,G.focal*v.V/B.availH),7,175);
  const dir=new THREE.Vector3(...v.d).normalize(), tgt=new THREE.Vector3(...v.t);
  return {p:tgt.clone().add(dir.multiplyScalar(dist)),t:tgt};
}
let resizeT=0;
function resizeBuffers(){

  const st=[[bigInt(m.leads),t("f_leads"),"c0",null],[nice(m.posMo),t("f_int"),"c1",pct(m.pos)],[big(m.meetMo),t("f_meet"),"c2",pct(m.book)],[m.dealsMo<1?fmt(m.dealsMo,2):big(m.dealsMo),t("f_proj"),"c3",pct(m.close)]];
  $("flow").innerHTML=st.map((s,i)=>(i?`<div class="fop"><em>× ${s[3]}</em></div>`:"")+`<div class="fcell ${s[2]}"><b>${m.ok?s[0]:"—"}</b><span>${s[1]}</span></div>`).join("");
  $("o-boxes").textContent=fmt(m.boxes); $("o-doms").textContent=fmt(m.doms); $("o-epd").textContent=bigInt(m.epd); $("o-epm").textContent=bigInt(m.epm); $("o-warm").textContent=fmt(m.warm);
  $("o-boxes-note").textContent=m.reserve?t("n_boxes_r",{s:fmt(m.send)}):t("n_boxes",{n:fmt(m.perbox)});
  $("o-doms-note").textContent=t("n_doms",{n:fmt(m.perdom)}); $("o-epm-note").textContent=t("n_epm",{n:fmt(m.seq)});
  const rows=[
    [t("r_clients"),`${mC(m.gap)} ÷ ${mC(m.deal)} ÷ 12`,fmt(m.dealsMo,2)],
    [t("r_calls"),`${fmt(m.dealsMo,2)} ÷ ${pct(m.close)} ${t("w_close")}`,fmt(m.meetMo,1)],
    [t("r_pos"),`${fmt(m.meetMo,1)} ÷ ${pct(m.book)} ${t("w_book")}`,fmt(m.posMo,1)],
    [t("r_leads"),`${fmt(m.posMo,1)} ÷ ${pct(m.pos)} ${t("w_pos")}`,fmt(m.leads),1],
    [t("r_epm"),`${fmt(m.leads)} × ${fmt(m.seq)} ${t("w_seq")}`,fmt(m.epm)],
    [t("r_epd"),`${fmt(m.epm)} ÷ ${fmt(m.days)} ${t("w_days")}`,fmt(m.epd)],
    [t("r_send"),`${fmt(m.epm/(m.days||1),1)} ÷ ${fmt(m.perbox)} ${t("w_perbox")}`,fmt(m.send),m.reserve?0:1]];
  if(m.reserve) rows.push([t("r_backup"),`${fmt(m.send)} × 2`,fmt(m.boxes),1]);
  rows.push([t("r_doms"),`${fmt(m.boxes)} ÷ ${fmt(m.perdom)} ${t("w_perdom")}`,fmt(m.doms),1]);
  rows.push([t("r_senddays"),t("f_senddays",{w:fmt(m.warm)}),fmt(m.sendDays)]);
  rows.push([t("r_leads60"),`${fmt(m.leads)} × ${fmt(m.sendDays)} ÷ 30`,fmt(m.leads60)]);
  rows.push([t("r_meet60"),`${fmt(m.meetMo,1)} × ${fmt(m.bookDays)} ÷ 30 ${t("f_meet60_tail",{l:fmt(m.lag)})}`,fmt(m.meet60,1),1]);
  rows.push([t("r_pipe60"),`${fmt(m.meet60,1)} × ${pct(m.close)} × ${mC(m.deal)}`,mC(m.pipe60),1]);
  $("steps").innerHTML=m.ok?rows.map(r=>`<tr><td>${r[0]}</td><td class="f">${r[1]}</td><td class="r${r[3]?" hl":""}">${r[2]}</td></tr>`).join(""):`<tr><td colspan="3">${t("empty")}</td></tr>`;
}
let rebuildTimer=0;
function recompute(){
  M=model(); drawTL(M); setHead(DAY/HZ); tpRender(); hud(); renderFull(); renderInspector(); fitHud();
  document.querySelectorAll("#presets .chip").forEach(c=>c.setAttribute("aria-pressed",String(+c.dataset.v===S.gap)));
  clearTimeout(rebuildTimer); rebuildTimer=setTimeout(()=>{ rebuild(); },60);
}
function paintR(id){ const R=$(id); const p=(R.value-R.min)/(R.max-R.min)*100; R.style.setProperty("--p",clamp(p,0,100)+"%"); }
function syncMoney(k){ $(k).value=fmt(S[k]); $(k+"R").value=fromLog(Math.max(S[k],RANGE[k][0]),RANGE[k]); paintR(k+"R"); }
function syncAll(){ syncMoney("gap"); syncMoney("deal"); $("close").value=S.close; $("closeR").value=Math.min(80,S.close); paintR("closeR"); }
["gap","deal"].forEach(k=>{
  $(k+"R").addEventListener("input",()=>{ S[k]=round2(toLog(+$(k+"R").value,RANGE[k])); $(k).value=fmt(S[k]); paintR(k+"R"); recompute(); });
  $(k).addEventListener("input",()=>{ S[k]=moneyDigits($(k).value); if(S[k]){ $(k+"R").value=fromLog(Math.max(S[k],RANGE[k][0]),RANGE[k]); paintR(k+"R"); } recompute(); });
  $(k).addEventListener("blur",()=>{ if(S[k]) $(k).value=fmt(S[k]); });
});
$("closeR").addEventListener("input",()=>{ S.close=+$("closeR").value; $("close").value=S.close; paintR("closeR"); recompute(); });
$("close").addEventListener("input",()=>{ S.close=Math.min(100,pctNum($("close").value)); if(S.close){ $("closeR").value=Math.min(80,S.close); paintR("closeR"); } recompute(); });
["pos","book","seq","days","perbox","perdom","warm","lag","reserve"].forEach(id=>$(id).addEventListener("input",recompute));
$("reset").addEventListener("click",()=>{ Object.entries({pos:1,book:33,seq:2,days:26,perbox:20,perdom:3,warm:20,lag:5}).forEach(([k,v])=>$(k).value=v); $("reserve").checked=false; recompute(); });
const PRESETS=[100000,500000,1000000,5000000];
function buildPresets(){
  const box=$("presets"); box.textContent="";
  PRESETS.forEach(v=>{ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.dataset.v=v; b.textContent=mC(v); b.setAttribute("aria-pressed",String(v===S.gap)); b.addEventListener("click",()=>{ S.gap=v; syncMoney("gap"); recompute(); }); box.appendChild(b); });
}
function buildSelects(){
  $("lang").innerHTML=Object.entries(I18N).map(([k,v])=>`<option value="${k}"${k===LANG?" selected":""}>${v.name}</option>`).join("");
  let dn=null; try{ dn=new Intl.DisplayNames([LOC()],{type:"currency"}); }catch(e){}
  const name=c=>{ try{ return dn?dn.of(c):c; }catch(e){ return c; } };
  let all=[]; try{ all=Intl.supportedValuesOf("currency"); }catch(e){}
  const popular=["USD","EUR","GBP","CAD","AUD","CHF","JPY","INR","BRL","MXN","AED","SGD","ZAR","NGN","MAD","SAR","SEK","PLN","NZD","HKD"];
  const rest=all.filter(c=>!popular.includes(c)).sort();
  const opt=c=>`<option value="${c}"${c===CUR?" selected":""}>${c} · ${name(c)}</option>`;
  $("cur").innerHTML=`<optgroup label="${t("popular")}">${popular.map(opt).join("")}</optgroup>`+(rest.length?`<optgroup label="${t("all")}">${rest.map(opt).join("")}</optgroup>`:"");
  if(!$("cur").value){ CUR="USD"; $("cur").value="USD"; }
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  const cp=curParts();
  document.querySelectorAll(".val .cb").forEach(e=>e.textContent=cp.before?cp.sym:"");
  document.querySelectorAll(".val .ca").forEach(e=>e.textContent=cp.before?"":cp.sym);
  $("hint").textContent=coarse?t("hint_touch"):t("hint");
  $("fs").setAttribute("aria-label",t("fs_on")); $("fs").title=t("fs_on");
  $("vp").setAttribute("aria-label",t("vp_label"));
  ["gap","deal","close"].forEach(k=>{ const lab=document.querySelector(`label[for=${k}R]`); if(lab) lab.title=t(k+"_h"); });
  buildSelects(); buildPresets(); buildChips(); buildLabels(); syncAll(); ctaState();
  if(G.R) G.R.domElement.setAttribute("aria-label",t("vp_label"));
}
$("lang").addEventListener("change",e=>{ LANG=e.target.value; store.set("os-lang",LANG); for(const k in shown) delete shown[k]; applyI18n(); recompute(); scaleNote(); });
$("cur").addEventListener("change",e=>{ CUR=e.target.value; store.set("os-cur",CUR); for(const k in shown) delete shown[k]; applyI18n(); recompute(); });

/* overlay sizes feed the CSS (console + transport heights) */
function measureOverlays(){
  document.documentElement.style.setProperty("--hdr",document.querySelector(".top").offsetHeight+"px");
  const st=$("studio"); st.style.setProperty("--ch",$("console").offsetHeight+"px"); st.style.setProperty("--tph",$("tp").offsetHeight+"px");
}

/* ---------- boot ---------- */
applyI18n();
M=model(); drawTL(M); setHead(1); tpRender(); hud(); renderFull(); renderInspector();
measureOverlays(); fitHud();
new ResizeObserver(()=>{ measureOverlays(); }).observe($("console"));
new ResizeObserver(()=>{ measureOverlays(); }).observe(document.querySelector(".top"));
init3D();
labelValues();
new ResizeObserver(()=>{ const w=$("stage").clientWidth; if(Math.abs(w-lastW)>1){ drawTL(M); setHead(DAY/HZ); } }).observe($("stage"));
})();
</script>
